[package]
name = "rav"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Rust AV CLI tool - FFmpeg-compatible command-line interface"

[[bin]]
name = "rav"
path = "src/main.rs"

[dependencies]
av-core = { path = "../../crates/av-core" }
av-io = { path = "../../crates/av-io" }
av-format = { path = "../../crates/av-format" }
av-codec = { path = "../../crates/av-codec" }
av-filter = { path = "../../crates/av-filter" }
av-swscale = { path = "../../crates/av-swscale" }
av-swresample = { path = "../../crates/av-swresample" }
av-hwaccel = { path = "../../crates/av-hwaccel" }
clap = { version = "4.5", features = ["derive", "cargo"] }
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
